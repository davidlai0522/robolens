site_name: RoboLens
site_description: High-quality robotics & AI research — explained locally with Gemma 4
site_url: https://davidlai0522.github.io/robolens

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: deep orange
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.instant
    - navigation.top
    - content.code.copy
    - search.highlight
    - toc.integrate

plugins:
  - search
  - blog:
      blog_dir: posts
      post_date_format: long
      post_url_format: "{slug}"
  - tags

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables
